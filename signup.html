<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GRAILS Sneaker &amp; Streetwear Boutique</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="description"
        content="Join GRAILS Boutique for priority raffle entry, drop alerts, verified purchase history, and exclusive streetwear releases.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>

<body class="signup-page">
    <!-- Floating Particles -->
    <div id="particles-container"></div>
    <div class="auth-top-actions d-flex align-items-center gap-3">
        <button id="darkModeToggle" class="btn nav-utility-btn" type="button" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
        <button id="rtlToggle" class="btn nav-utility-btn" type="button" aria-label="Toggle RTL mode">RTL</button>
        <a href="contact.html" class="btn-visit-info d-none d-xl-inline-flex" id="visitInfoBtn" aria-label="Visit Info"><i class="bi bi-geo-alt-fill"></i> Visit Info</a>
    </div>

    <main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 reveal">
                    <div class="card-luxury p-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <span class="brand-logo" aria-label="GRAILS">
                                    <span class="brand-logo-icon" aria-hidden="true"><i class="bi bi-fire"></i></span>
                                    <span class="brand-logo-text"><span class="brand-logo-sparkle">GRA</span><span class="brand-logo-magic">ILS</span></span>
                                </span>
                            </a>
                        </div>
                        <h2 class="brand-font text-center mb-2">Create Account</h2>
                        <p class="text-center text-secondary small mb-4">Join our VIP circle for priority drop raffles, order tracking, and exclusive streetwear access.</p>

                        <!-- Social Login -->
                        <div class="d-grid gap-3 mb-4 auth-social-stack">
                            <button class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                                <i class="bi bi-google text-danger"></i> Sign up with Google
                            </button>
                            <button class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                                <i class="bi bi-apple text-dark"></i> Sign up with Apple
                            </button>
                        </div>

                        <div class="d-flex align-items-center gap-3 mb-4">
                            <hr class="flex-grow-1 opacity-25">
                            <span class="small text-secondary fw-bold">OR EMAIL</span>
                            <hr class="flex-grow-1 opacity-25">
                        </div>

                        <form>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label accent-font small fw-bold">First Name</label>
                                    <input type="text" class="form-control p-3 border-0 bg-light shadow-none" placeholder="Alex" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label accent-font small fw-bold">Last Name</label>
                                    <input type="text" class="form-control p-3 border-0 bg-light shadow-none" placeholder="Rivers" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label accent-font small fw-bold">Email Address</label>
                                <input type="email" class="form-control p-3 border-0 bg-light shadow-none" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label accent-font small fw-bold">Shoe Size (UK/US)</label>
                                <input type="text" class="form-control p-3 border-0 bg-light shadow-none" placeholder="e.g. UK 9.5 / US 10">
                            </div>
                            <div class="mb-4">
                                <label class="form-label accent-font small fw-bold">Password</label>
                                <div class="auth-password-wrap">
                                    <input type="password" id="signupPassword" class="form-control p-3 border-0 bg-light shadow-none" placeholder="Create strong password" required>
                                    <button type="button" class="auth-password-toggle" data-toggle-password="#signupPassword" aria-label="Show password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn-premium w-100 py-3 fs-5 mb-4">Join GRAILS</button>
                        </form>

                        <p class="text-center text-secondary small mb-0">
                            Already have an account? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary-accent);">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
